spi:
  # FSPID is MOSI, FSPIQ is MISO, FSPICS0 is chip select, FSPICLK is the clock
  clk_pin: GPIO6
  mosi_pin: GPIO7
  miso_pin: GPIO2

# select type of sample to take
select:
  - platform: template
    name: "Measurement Type"
    id: measurement_type_select
    options:
      - "single"
      - "avg2"
      - "avg4"
      - "avg8"
      - "avg16"
    initial_option: "avg8"
    set_action:
      then:
        - lambda: 'id(allsensorsdlhr_sensor).set_measurement_type(MEASUREMENT_TYPES[std::string(x)]);'

sensor:
  - platform: allsensorsdlhr
    pressure:
      name: "DLHR - Static Pressure"
      unit_of_measurement: "inH2O"
      accuracy_decimals: 3
      pressure_range: 2.0
      # gauge = 1.0, differential = 2.0
      pressure_type: 2.0
    temperature:
      name: "DLHR - Temperature - Calibration Reference"
      accuracy_decimals: 1
    # Required for SPI (DLHR pin #8 /SS)
    cs_pin: GPIO10
    update_interval: "10s"